<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MNIST - Reconocimiento de números</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f4f6f8;
    margin: 0;
    padding: 20px 0;
}

.container {
    width: min(420px, calc(100vw - 32px));
    margin: 30px auto;
    background: white;
    padding: 24px;
    box-sizing: border-box;
    border-radius: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,.15);
}

canvas {
    background: black;
    border: 3px solid #444;
    cursor: crosshair;
    touch-action: none;
    width: min(280px, 100%);
    height: auto;
    display: block;
    margin: 0 auto;
}

button {
    margin: 15px 5px;
    padding: 10px 20px;
    font-size: 16px;
}

#resultado {
    font-size: 22px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h2>Reconocimiento de dígitos</h2>

<p>Dibuja un número del 0 al 9</p>

<canvas id="canvas" width="280" height="280"></canvas>

<br>

<button onclick="limpiar()">Borrar</button>
<button onclick="predecir()">Predecir</button>

<div id="resultado"></div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

ctx.fillStyle = "black";
ctx.fillRect(0, 0, canvas.width, canvas.height);

ctx.strokeStyle = "white";
ctx.lineWidth = 22;
ctx.lineCap = "round";
ctx.lineJoin = "round";

let dibujando = false;

function posicion(e) {
    const rect = canvas.getBoundingClientRect();
    const escalaX = canvas.width / rect.width;
    const escalaY = canvas.height / rect.height;

    return {
        x: (e.clientX - rect.left) * escalaX,
        y: (e.clientY - rect.top) * escalaY
    };
}

function iniciarDibujo(e) {
    e.preventDefault();
    dibujando = true;

    if (canvas.setPointerCapture) {
        canvas.setPointerCapture(e.pointerId);
    }

    const p = posicion(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
}

function terminarDibujo(e) {
    if (!dibujando) return;
    e.preventDefault();
    dibujando = false;
    ctx.beginPath();
}

function dibujar(e) {
    if (!dibujando) return;
    e.preventDefault();

    const p = posicion(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
}

canvas.addEventListener("pointerdown", iniciarDibujo);
canvas.addEventListener("pointermove", dibujar);
canvas.addEventListener("pointerup", terminarDibujo);
canvas.addEventListener("pointercancel", terminarDibujo);
canvas.addEventListener("pointerleave", terminarDibujo);

function limpiar() {
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    document.getElementById("resultado").innerHTML = "";
}

function predecir() {
    canvas.toBlob(async blob => {
        const formData = new FormData();
        formData.append("file", blob, "numero.png");

        const response = await fetch("/predict", {
            method: "POST",
            body: formData
        });

        const resultado = await response.json();

        document.getElementById("resultado").innerHTML =
            "Número: <b>" + resultado.digit +
            "</b><br>Confianza: " +
            (resultado.confidence * 100).toFixed(2) +
            "%";

    }, "image/png");
}

</script>

</body>
</html>
